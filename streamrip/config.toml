[downloads]
# Folder where tracks are downloaded to
folder = ""
# Put Qobuz albums in a 'Qobuz' folder, Tidal albums in 'Tidal' etc.
source_subdirectories = false
# Put tracks in an album with 2 or more discs into a subfolder named `Disc N` 
disc_subdirectories = true
# Download (and convert) tracks all at once, instead of sequentially. 
# If you are converting the tracks, or have fast internet, this will 
# substantially improve processing speed.
concurrency = true
# The maximum number of tracks to download at once
# If you have very fast internet, you will benefit from a higher value,
# A value that is too high for your bandwidth may cause slowdowns
# Set to -1 for no limit
max_connections = 6
# Max number of API requests per source to handle per minute
# Set to -1 for no limit
requests_per_minute = 60
# Verify SSL certificates for API connections
# Set to false if you encounter SSL certificate verification errors (not recommended)
verify_ssl = true

[qobuz]
# 1: 320kbps MP3, 2: 16/44.1, 3: 24/<=96, 4: 24/>=96
quality = 3
# Deprecated/no-op in current builds: booklet files are not downloaded yet.
# Kept for backwards-compatible config parsing.
download_booklets = false

# Authenticate to Qobuz using auth token? Value can be true/false only
use_auth_token = false
# Enter your userid if the above use_auth_token is set to true, else enter your email
email_or_userid = ""
# Enter your auth token if the above use_auth_token is set to true, else enter the md5 hash of your plaintext password
password_or_token = ""
# Do not change
app_id = ""
# Do not change
secrets = []

[tidal]
# 0: 256kbps AAC, 1: 320kbps AAC, 2: 16/44.1 "HiFi" FLAC, 3: 24/44.1 "MQA" FLAC
quality = 3
# This will download videos included in Video Albums.
download_videos = true

# Do not change any of the fields below
user_id = ""
country_code = ""
access_token = ""
refresh_token = ""
# Tokens last 1 week after refresh. This is the Unix timestamp of the expiration
# time. If you haven't used streamrip in more than a week, you may have to log
# in again using `rip config --tidal`
token_expiry = ""

[deezer]
# 0, 1, or 2
# This applies to ARL-authenticated Deezer account downloads.
quality = 2
# If the target quality is not available, fallback to best quality available
# 0 = MP3_128, 1 = MP3_320, 2 = FLAC
lower_quality_if_not_available = true
# An authentication cookie that allows streamrip to use your Deezer account
# See https://github.com/nathom/streamrip/wiki/Finding-Your-Deezer-ARL-Cookie
# for instructions on how to find this
arl = ""
# Deprecated/no-op in current builds: deezloader fallback is not implemented.
# Kept for backwards-compatible config parsing.
use_deezloader = false
# Deprecated/no-op in current builds. Kept for backwards-compatible config parsing.
deezloader_warnings = false

[soundcloud]
# Only 0 is available for now
quality = 0
# This changes periodically, so it needs to be updated
client_id = ""
app_version = ""

[youtube]
# Only 0 is available for now
quality = 0
# Download the video along with the audio
download_videos = false
# The path to download the videos to
video_downloads_folder = ""

[database]
# Create a database that contains all the track IDs downloaded so far
# Any time a track logged in the database is requested, it is skipped
# This can be disabled temporarily with the --no-db flag
downloads_enabled = true
# Path to the downloads database 
downloads_path = ""
# If a download fails, the item ID is stored here. Then, `rip repair` can be
# called to retry the downloads
failed_downloads_enabled = true
failed_downloads_path = ""
# Path to a CSV file where failed downloads are logged with track details (title, artist, error)
# This file can be opened in any spreadsheet application for auditing and retry planning
# Leave empty to use the default path in the app directory
failed_downloads_log_path = ""

# Convert tracks to a codec after downloading them.
[conversion]
enabled = false
# FLAC, ALAC, OPUS, MP3, VORBIS, or AAC
codec = "ALAC"
# In Hz. Tracks are downsampled if their sampling rate is greater than this. 
# Value of 48000 is recommended to maximize quality and minimize space
sampling_rate = 48000
# Only 16 and 24 are available. It is only applied when the bit depth is higher
# than this value.
bit_depth = 24
# Only applicable for lossy codecs
lossy_bitrate = 320

[csv_resolver]
# CSV resolver controls concurrency, rate limiting, and cooldowns for CSV resolve/repair
# provider calls. In this config, "source" means provider key (e.g. qobuz/deezer).
# Max in-flight search calls per provider (positive int; values <= 0 are clamped to 1). Default: 3.
search_inflight_per_provider = 3
# Max in-flight metadata calls per provider (positive int; values <= 0 are clamped to 1). Default: 2.
metadata_inflight_per_provider = 2
# Max in-flight URL acquisition calls per provider (positive int; values <= 0 are clamped to 1). Default: 2.
url_inflight_per_provider = 2
# Minimum delay between provider API calls in seconds (non-negative float; 0 disables enforced delay). Default: 0.2.
provider_min_interval_seconds = 0.2
# Base cooldown seconds after failure streak threshold is reached (non-negative float; clamped to >= 0). Default: 10.0.
cooldown_base_seconds = 10.0
# Maximum cooldown cap seconds (non-negative float; if lower than base, max cap is used as-is). Default: 120.0.
cooldown_max_seconds = 120.0
# Consecutive failures before cooldown opens (positive int; <= 0 effectively disables failure-triggered cooldown). Default: 4.
failure_streak_for_cooldown = 4
# Search result limit for escalation lane (positive int; invalid/<=0 falls back to default 15; higher values increase provider load).
escalation_search_limit = 15
# CSV resolve/repair primary search provider/source key when CLI --source is omitted.
default_source = "qobuz"
# CSV resolve/repair fallback provider/source key when CLI --fallback-source is omitted.
default_fallback_source = "deezer"
# Opt-in: pre-scan local audio files and skip provider searches for rows that already
# exist on disk. Disabled by default to preserve existing behavior.
local_skip_enabled = false
# Optional folders to scan for local-skip matching. Empty list means: use [downloads].folder.
local_skip_paths = []
# File extensions considered by local-skip matching (case-insensitive).
local_skip_extensions = ["flac", "mp3", "m4a", "ogg", "opus", "aac"]
# If true, local skip validates expected CSV duration when available.
local_skip_require_duration_check = true
# Hybrid tolerance: accept when abs(actual-expected) <= max(seconds, expected*ratio).
local_skip_duration_tolerance_ratio = 0.20
local_skip_duration_tolerance_seconds = 12
# Safety cap: max number of files scanned into the local-skip index.
local_skip_max_file_scan = 25000
# Enable variant-aware identity/policy scoring for CSV track resolution.
variant_policy_enabled = true
# Unexpected candidate variant policy modes: "equivalent", "penalty", "reject".
live_mode = "reject"
acoustic_mode = "reject"
instrumental_mode = "reject"
radio_edit_mode = "penalty"
remaster_mode = "equivalent"
# If true, year differences are de-emphasized when remaster context exists.
year_ignore_for_remaster = true
# Reject obvious junk release contexts (karaoke, tribute, commentary, podcast, etc).
reject_bad_context_releases = true
# Include-only fields scanned for bad-context markers. Unknown fields are ignored.
# Env override: STREAMRIP_BAD_CONTEXT_FIELDS=title,album,version
bad_context_fields = ["title", "album"]
# Optional per-provider minimum acceptance score. Empty map keeps existing defaults.
# Example: acceptance_threshold_by_source = { qobuz = 52, deezer = 50 }
acceptance_threshold_by_source = {}
# Optional JSONL file path for candidate scoring telemetry (empty disables).
telemetry_jsonl_path = ""
# Optional guarded fuzzy fallback in normal mode (strict high-similarity + corroboration).
enable_guarded_fuzzy_normal = false

# Filter a Qobuz artist's discography. Set to 'true' to turn on a filter.
# This will also be applied to other sources, but is not guaranteed to work correctly
[qobuz_filters]
# Remove Collectors Editions, live recordings, etc.
extras = false
# Picks the highest quality out of albums with identical titles.
repeats = false
# Remove EPs and Singles
non_albums = false
# Remove albums whose artist is not the one requested
features = false
# Skip non studio albums
non_studio_albums = false
# Only download remastered albums
non_remaster = false

[artwork]
# Write the image to the audio file
embed = true
# The size of the artwork to embed. Options: thumbnail, small, large, original.
# "original" images can be up to 30MB, and may fail embedding. 
# Using "large" is recommended.
embed_size = "large"
# If this is set to a value > 0, max(width, height) of the embedded art will be set to this value in pixels
# Proportions of the image will remain the same
embed_max_width = -1
# Save the cover image at the highest quality as a seperate jpg file
save_artwork = true
# If this is set to a value > 0, max(width, height) of the saved art will be set to this value in pixels
# Proportions of the image will remain the same
saved_max_width = -1


[metadata]
# Sets the value of the 'ALBUM' field in the metadata to the playlist's name. 
# This is useful if your music library software organizes tracks based on album name.
set_playlist_to_album = true
# If part of a playlist, sets the `tracknumber` field in the metadata to the track's 
# position in the playlist instead of its position in its album
renumber_playlist_tracks = true
# The following metadata tags won't be applied
# See https://github.com/nathom/streamrip/wiki/Metadata-Tag-Names for more info
exclude = []
# Exportify CSV column -> file metadata tag mapping (Exportify CSV mode only).
# Best-effort only: metadata/tagging failures are logged but never fail a track or the batch.
# Empty map disables all Exportify extra metadata mapping.
# Default mappings:
# exportify_tag_map = { "Genres" = "genre", "Loudness" = "exportify_loudness", "Tempo" = "tempo" }
#
# Example custom mappings:
# exportify_tag_map = {
#   "Genres" = "genre",
#   "Loudness" = "replaygain_reference_loudness",
#   "Tempo" = "bpm",
#   "Added At" = "spotify_added_at",
#   "Track URI" = "spotify_track_uri",
#   "Record Label" = "spotify_record_label"
# }
#
# Notes:
# - Known native tags use existing/native handling where supported.
# - Unknown/custom tags are written as container-specific custom/freeform tags.
# - For "Genres", CSV genres are merged with provider genre metadata (no duplicates).
exportify_tag_map = { "Genres" = "genre", "Loudness" = "exportify_loudness", "Tempo" = "tempo" }

# Changes the folder and file names generated by streamrip.
[filepaths]
# Create folders for single tracks within the downloads directory using the folder_format
# template
add_singles_to_folder = false
# Available keys: "albumartist", "title", "year", "bit_depth", "sampling_rate",
# "id", and "albumcomposer"
folder_format = "{albumartist} - {title} ({year}) [{container}] [{bit_depth}B-{sampling_rate}kHz]"
# Available keys: "id", "tracknumber", "artist", "albumartist", "composer", "title",
# and "albumcomposer", "explicit"
track_format = "{tracknumber:02}. {artist} - {title}{explicit}"
# Only allow printable ASCII characters in filenames.
restrict_characters = false
# Truncate the filename if it is greater than this number of characters
# Setting this to false may cause downloads to fail on some systems
truncate_to = 120

# Last.fm playlists are downloaded by searching for the titles of the tracks
[lastfm]
# Search provider/source key used for track lookup.
source = "qobuz"
# Fallback provider/source key used when primary has no usable result.
# This applies to all Last.fm playlist resolution flows. For CSV-specific
# workflows, [csv_resolver].default_fallback_source takes precedence.
fallback_source = "deezer"

[cli]
# Print "Downloading {Album name}" etc. to screen
text_output = true
# Show resolve, download progress bars
progress_bars = true
# The maximum number of search results to show in the interactive menu
max_search_results = 100

# Reliability settings for batch and long-running workflows
[reliability]
# Number of times to retry a failed download before giving up (0 = no retry)
retry_count = 3
# Initial delay in seconds before the first retry
retry_delay = 2.0
# Multiplier applied to delay after each retry (exponential backoff)
# e.g. with delay=2 and factor=2: waits 2s, 4s, 8s between successive retries
retry_backoff_factor = 2.0
# Stop the entire run immediately on the first failure.
# By default (false) all items are attempted and failures are reported at the end.
fail_fast = false
# Verify downloaded FLAC files for integrity using mutagen.
# Corrupt files are removed and recorded in the failed-downloads log.
validate_flac = true

[misc]
# Metadata to identify this config file. Do not change.
version = "2.3.0"
# Print a message if a new version of streamrip is available 
check_for_updates = true
