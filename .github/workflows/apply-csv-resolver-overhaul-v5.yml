name: Apply CSV resolver overhaul v5

on:
  push:
    branches:
      - cx/csv-resolver-recall-precision

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: cx/csv-resolver-recall-precision
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Refine compatibility and request bounds
        run: python tools/_refine_resolver_overhaul.py

      - name: Tighten artist identity guard
        run: python tools/_tighten_resolver_artist_guard.py

      - name: Apply deterministic source patch
        run: python tools/_apply_resolver_overhaul.py

      - name: Make generated Unicode normalisation Ruff-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("streamrip/file_lists.py")
          text = path.read_text()
          replacements = {
              chr(0x2019): "\\u2019",
              chr(0x2018): "\\u2018",
              chr(0x201C): "\\u201c",
              chr(0x201D): "\\u201d",
              chr(0x2013): "\\u2013",
              chr(0x2014): "\\u2014",
              chr(0x2212): "\\u2212",
          }
          for character, escaped in replacements.items():
              text = text.replace(character, escaped)
          path.write_text(text)
          PY

      - name: Compile changed Python
        run: |
          python -m py_compile streamrip/file_lists.py
          python -m py_compile streamrip/media/csv_playlist.py
          python -m py_compile tests/test_file_lists.py
          python -m py_compile tests/test_csv_playlist.py
          python -m py_compile tests/test_csv_resolver_overhaul.py
          python -m py_compile tools/benchmark_csv_resolver.py

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1
          virtualenvs-create: false
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install dependencies
        run: poetry install

      - name: Ruff check changed code
        run: poetry run ruff check streamrip/file_lists.py streamrip/media/csv_playlist.py tests/test_file_lists.py tests/test_csv_playlist.py tests/test_csv_resolver_overhaul.py tools/benchmark_csv_resolver.py

      - name: Targeted resolver tests
        run: poetry run pytest tests/test_csv_resolver_overhaul.py tests/test_file_lists.py tests/test_csv_playlist.py
        env:
          PYTHONPATH: .

      - name: Deterministic resolver benchmark
        run: poetry run python tools/benchmark_csv_resolver.py
        env:
          PYTHONPATH: .

      - name: Full test suite
        run: poetry run pytest
        env:
          PYTHONPATH: .

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-csv-resolver-overhaul.yml \
            .github/workflows/apply-csv-resolver-overhaul-v2.yml \
            .github/workflows/apply-csv-resolver-overhaul-v3.yml \
            .github/workflows/apply-csv-resolver-overhaul-v4.yml \
            .github/workflows/apply-csv-resolver-overhaul-v5.yml \
            tools/_apply_resolver_overhaul.py \
            tools/_refine_resolver_overhaul.py \
            tools/_tighten_resolver_artist_guard.py
          git add \
            README.md \
            streamrip/file_lists.py \
            streamrip/media/csv_playlist.py \
            tests/test_file_lists.py \
            tests/test_csv_playlist.py \
            tests/test_csv_resolver_overhaul.py \
            tools/benchmark_csv_resolver.py
          git diff --cached --check
          git commit -m "Improve CSV resolver recall with strict matching guards"
          git push origin HEAD:cx/csv-resolver-recall-precision
