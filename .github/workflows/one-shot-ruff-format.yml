name: One-shot Ruff format

on:
  push:
    branches:
      - cx/csv-resolver-recall-precision

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[ruff-formatted]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cx/csv-resolver-recall-precision
          fetch-depth: 0

      - uses: astral-sh/ruff-action@v3
        with:
          args: format streamrip/client/downloadable.py streamrip/file_lists.py streamrip/media/csv_playlist.py

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- streamrip/client/downloadable.py streamrip/file_lists.py streamrip/media/csv_playlist.py; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamrip/client/downloadable.py streamrip/file_lists.py streamrip/media/csv_playlist.py
          git commit -m "Apply Ruff formatting [ruff-formatted]"
          git push origin HEAD:cx/csv-resolver-recall-precision
