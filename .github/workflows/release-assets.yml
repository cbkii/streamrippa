name: Release

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (with or without leading v, e.g. 2026.04.09)'
        required: false
        default: ''
      prev_version:
        description: 'Previous version override for changelog scope (optional)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Derive TAG, VERSION, ARCHIVE ─────────────────────────────────────────
      - name: Derive context
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            V="${V#v}"   # strip optional leading v
            TAG="v${V}"
          else
            TAG="${GITHUB_REF_NAME}"
            V="${TAG#v}"
          fi
          ARCHIVE="streamrippa-${V}.tar.gz"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${V}"       >> "$GITHUB_OUTPUT"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      # ── Manual runs: create and push tag if it doesn't exist ─────────────────
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ctx.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      # ── Validate VERSION file matches tag version ─────────────────────────────
      - name: Validate VERSION
        run: |
          REPO_VERSION=$(cat VERSION)
          if [ "${{ steps.ctx.outputs.version }}" != "$REPO_VERSION" ]; then
            echo "::error::VERSION mismatch: tag=${{ steps.ctx.outputs.version }} VERSION file=$REPO_VERSION"
            exit 1
          fi

      # ── Build wheel and sdist ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: false

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build distributions
        run: poetry build

      # ── Create source tarball ─────────────────────────────────────────────────
      - name: Create tarball
        run: |
          ARCHIVE="${{ steps.ctx.outputs.archive }}"
          tar -czf "$ARCHIVE" pyproject.toml VERSION README.md CHANGELOG.md streamrip/

      # ── Create SHA256SUMS ──────────────────────────────────────────────────────
      - name: Create SHA256SUMS
        run: |
          sha256sum dist/*.whl dist/*.tar.gz "${{ steps.ctx.outputs.archive }}" > SHA256SUMS
          cat SHA256SUMS

      # ── Create release-metadata.json ──────────────────────────────────────────
      - name: Create release-metadata.json
        run: |
          VERSION="${{ steps.ctx.outputs.version }}"
          TAG="${{ steps.ctx.outputs.tag }}"
          printf '{\n  "version": "%s",\n  "tag": "%s",\n  "repo": "%s",\n  "commit": "%s",\n  "built_at": "%s"\n}\n' \
            "$VERSION" "$TAG" "${{ github.repository }}" "${{ github.sha }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release-metadata.json

      # ── Determine previous version ────────────────────────────────────────────
      - name: Determine previous version
        id: prev
        run: |
          TAG="${{ steps.ctx.outputs.tag }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.prev_version }}" ]; then
            PV="${{ github.event.inputs.prev_version }}"
            PV="${PV#v}"
            PREV_TAG="v${PV}"
            PREV_VERSION="$PV"
          else
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo "")
            PREV_VERSION="${PREV_TAG#v}"
          fi
          echo "prev_tag=${PREV_TAG}"         >> "$GITHUB_OUTPUT"
          echo "prev_version=${PREV_VERSION}" >> "$GITHUB_OUTPUT"

      # ── Extract release notes from CHANGELOG.md ───────────────────────────────
      - name: Extract release notes
        run: |
          VERSION="${{ steps.ctx.outputs.version }}"
          PREV_VERSION="${{ steps.prev.outputs.prev_version }}"
          TAG="${{ steps.ctx.outputs.tag }}"

          # For pre-release tags (e.g. v2026.04.09-beta), strip suffix for heading lookup
          BASE_VERSION="${VERSION%%-*}"
          PREV_BASE="${PREV_VERSION%%-*}"

          echo "=== Debug: changelog extraction ==="
          echo "Current tag:      ${TAG}"
          echo "Current version:  ${VERSION}"
          echo "Base version:     ${BASE_VERSION}"
          echo "Prev tag:         ${{ steps.prev.outputs.prev_tag }}"
          echo "Prev version:     ${PREV_VERSION}"

          CURR_LINE=$(grep -n "^## \[${BASE_VERSION}\]" CHANGELOG.md | head -1 | cut -d: -f1)
          echo "Current heading found at line: ${CURR_LINE:-(not found)}"

          if [ -n "$CURR_LINE" ]; then
            if [ -n "$PREV_BASE" ]; then
              PREV_LINE=$(grep -n "^## \[${PREV_BASE}\]" CHANGELOG.md | head -1 | cut -d: -f1)
            else
              PREV_LINE=""
            fi

            if [ -n "$PREV_LINE" ]; then
              sed -n "${CURR_LINE},$((PREV_LINE - 1))p" CHANGELOG.md > release-notes.md
            else
              sed -n "${CURR_LINE},\$p" CHANGELOG.md > release-notes.md
            fi

            LINE_COUNT=$(wc -l < release-notes.md)
            echo "Lines extracted:  ${LINE_COUNT}"
          else
            echo "WARNING: heading ## [${BASE_VERSION}] not found in CHANGELOG.md"
          fi

          # Fallback: link to CHANGELOG.md at the tag if extraction is empty
          if [ ! -s release-notes.md ]; then
            echo "Using fallback release notes (link to CHANGELOG.md)"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for release notes.\n' \
              "${{ github.repository }}" "${TAG}" > release-notes.md
          fi

          echo "=== release-notes.md ==="
          cat release-notes.md

      # ── Publish GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ctx.outputs.tag }}"
          gh release create "$TAG" \
            --title "streamrippa ${TAG}" \
            --notes-file release-notes.md \
            dist/*.whl \
            dist/*.tar.gz \
            "${{ steps.ctx.outputs.archive }}" \
            SHA256SUMS \
            release-metadata.json

      # ── Print release URL to logs and job summary ─────────────────────────────
      - name: Print release URL
        run: |
          TAG="${{ steps.ctx.outputs.tag }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo "Release URL: ${RELEASE_URL}"
          printf '## 🚀 Release published\n\n**[%s](%s)**\n' "${TAG}" "${RELEASE_URL}" \
            >> "$GITHUB_STEP_SUMMARY"

